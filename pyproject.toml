[project]
name = "reel-relay"
version = "0.1.0"
description = "Share Instagram reels and carousels with Claude / Open WebUI via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.10,<3",
    "yt-dlp>=2025.6.9",
    "gallery-dl>=1.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
